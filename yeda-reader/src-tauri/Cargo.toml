[package]
name = "yeda-reader"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "yeda_reader_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
yeda-core = { path = "../../yeda-core" }
yeda-fs = { path = "../../yeda-fs" }
yeda-net = { path = "../../yeda-net" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
