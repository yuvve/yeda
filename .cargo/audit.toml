[advisories]
# quick-xml 0.38 through hayagriva's citationberg: citationberg's main branch is on 0.41
# (typst/citationberg#44) but unreleased (typst/citationberg#49), and hayagriva needs a release on
# that. It only parses the .csl file the user passes to :cite, so the denial of service needs the
# user's own file. Drop these once hayagriva updates.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

