[package]
name = "yeda-secrets"
version.workspace = true
edition = "2024"
authors = ["yuvve"]
license = "AGPL-3.0-only"
description = "yeda's passwords and API keys in the system secret store"
repository = "https://github.com/yuvve/yeda"

[dependencies]
anyhow = "1.0.104"
keyring-core = "1.0.1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
zbus = "5.19.0"
