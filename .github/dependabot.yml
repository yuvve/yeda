# Weekly dependency updates, one grouped PR per ecosystem. Security advisories come as soon as
# GitHub publishes them, outside the schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Kept on the major version zbus-secret-service-keyring-store uses.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
      # Must match the version openssl implements ForeignType from.
      - dependency-name: foreign-types
        versions: [">= 0.4"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # zotero/reader, with pdf.js inside it: the PDF parser that every untrusted PDF reaches.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
