name: Audit

# Known vulnerabilities in the dependencies, from the RustSec and npm advisory databases. Runs on
# its own schedule too, since advisories appear between pushes.
on:
  pull_request:
    paths: ["Cargo.lock", "package-lock.json", ".github/workflows/audit.yml"]
  push:
    branches: [main]
    paths: ["Cargo.lock", "package-lock.json", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high
