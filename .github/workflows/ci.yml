name: CI

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            yeda-reader/reader/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Mutable tags let a retargeted action run with this repository's token and secrets; Dependabot updates the pins.
      - name: Actions are pinned to commit SHAs
        run: |
          if grep -rnE '^\s*(-\s+)?uses:' .github/workflows | grep -vE 'uses:\s+(\./|[^@ ]+@[0-9a-f]{40}(\s|$))'; then
            echo "::error::pin these actions to a full commit SHA"; exit 1
          fi

      - name: System libraries for Tauri and git2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config

      - run: npm ci
      - run: npm run build:reader -w yeda-reader
      # yeda-android's Tauri context embeds its built frontend.
      - run: npm run build -w yeda-android

      - run: npm run check -w yeda-reader
      - run: npm run check -w yeda-android
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
