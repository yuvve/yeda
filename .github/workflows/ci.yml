name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            yeda-reader/reader/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: System libraries for Tauri and git2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config

      - run: npm ci
      - run: npm run build:reader -w yeda-reader
      # yeda-android's Tauri context embeds its built frontend.
      - run: npm run build -w yeda-android

      - run: npm run check -w yeda-reader
      - run: npm run check -w yeda-android
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
