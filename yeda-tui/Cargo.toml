[package]
name = "yeda"
version.workspace = true
edition = "2024"
authors = ["yuvve"]
license = "AGPL-3.0-only"
description = "A reference manager built on plain-text files and a terminal interface"
repository = "https://github.com/yuvve/yeda"
keywords = ["reference-manager", "bibliography", "research", "citations", "tui"]
categories = ["command-line-utilities", "science", "visualization"]
exclude = ["screenshots"]

[dependencies]
yeda-core = { workspace = true, features = ["zotero"] }
yeda-fs = { workspace = true }
yeda-net = { workspace = true }
yeda-reader = { workspace = true }
yeda-secrets = { workspace = true }
anyhow = "1.0.104"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
serde = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

[[bin]]
name = "yeda"
path = "src/main.rs"
