[package]
name = "yeda-tui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
yeda-core = { path = "../yeda-core", features = ["zotero"] }
yeda-fs = { path = "../yeda-fs" }
yeda-net = { path = "../yeda-net" }
anyhow = "1.0.104"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bin]]
name = "yeda"
path = "src/main.rs"
