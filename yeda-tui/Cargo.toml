[package]
name = "yeda-tui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
yeda-core = { path = "../yeda-core", features = ["zotero"] }
yeda-fs = { path = "../yeda-fs" }
yeda-net = { path = "../yeda-net" }
yeda-reader = { path = "../yeda-reader/src-tauri" }
yeda-secrets = { path = "../yeda-secrets" }
anyhow = "1.0.104"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
serde = "1"
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

[[bin]]
name = "yeda"
path = "src/main.rs"
