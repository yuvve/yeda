[package]
name = "yeda-android"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "yeda_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
toml = { version = "1.1.8", features = ["preserve_order"] }
yeda-core = { workspace = true }
yeda-fs = { workspace = true }
yeda-net = { workspace = true }
yeda-reader = { workspace = true }
yeda-secrets = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
foreign-types = "0.3"
libgit2-sys = "0.18"
openssl = { version = "0.10", features = ["vendored"] }
