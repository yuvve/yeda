[package]
name = "yeda-android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "yeda_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
toml = { version = "1.1.8", features = ["preserve_order"] }
yeda-core = { path = "../../yeda-core" }
yeda-fs = { path = "../../yeda-fs" }
yeda-net = { path = "../../yeda-net" }
yeda-reader = { path = "../../yeda-reader/src-tauri" }
yeda-secrets = { path = "../../yeda-secrets" }

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
