[workspace]
resolver = "3"
members = ["yeda-core", "yeda-net", "yeda-fs", "yeda-secrets", "yeda-tui", "yeda-reader/src-tauri", "yeda-android/src-tauri"]

# The version every crate is published under; scripts/release.sh bumps it.
[workspace.package]
version = "0.1.3"

# The crates' requirements on each other, bumped with the version above.
[workspace.dependencies]
yeda-core = { path = "yeda-core", version = "0.1.3" }
yeda-fs = { path = "yeda-fs", version = "0.1.3" }
yeda-net = { path = "yeda-net", version = "0.1.3" }
yeda-reader = { path = "yeda-reader/src-tauri", version = "0.1.3" }
yeda-secrets = { path = "yeda-secrets", version = "0.1.3" }
